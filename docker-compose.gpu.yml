# NVIDIA GPU 加速（需安裝 NVIDIA Container Toolkit，驅動 >= 580 / CUDA 13）
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile vlm up -d --build
# GPU 用 CDI 交給容器（nvidia.com/gpu=all）：主機的 systemd 重新載入設定（自動更新、snap 更新會觸發）時，
# 舊的寫法（deploy.resources 的 driver: nvidia）會讓容器失去 GPU，之後重新載入模型會悄悄改用 CPU。
# 需要 CDI 規格檔：NVIDIA Container Toolkit 1.18 以上會自動產生；較舊的版本執行一次
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
services:
  app:
    build:
      args:
        ORT_PACKAGE: onnxruntime-gpu[cuda,cudnn]==1.30.0
    environment:
      ORT_DEVICE: ${ORT_DEVICE:-cuda}
    devices:
      - nvidia.com/gpu=all

  ollama:
    devices:
      - nvidia.com/gpu=all
