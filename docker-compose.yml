name: lora-tag-studio

# 用法：
#   CPU                     docker compose up -d --build
#   + Ollama VLM            docker compose --profile vlm up -d --build
#   + JoyCaption (NSFW VLM) docker compose --profile joycaption up -d --build   （需 NVIDIA GPU）
#   + 本機訓練（AI Toolkit） docker compose --profile aitoolkit up -d --build    （需 NVIDIA GPU，.env 要設 AI_TOOLKIT_AUTH）
#   GPU 加速 WD14 / Ollama   加上 -f docker-compose.yml -f docker-compose.gpu.yml
#   也可以在 .env 設定 COMPOSE_FILE / COMPOSE_PROFILES，之後只需 docker compose up -d

services:
  app:
    build:
      context: .
      args:
        ORT_PACKAGE: ${ORT_PACKAGE:-onnxruntime==1.30.0}
    image: lora-tag-studio:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7870}:7870"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 讓容器連到主機上的 Ollama / LM Studio
    environment:
      API_KEY: ${API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      WD14_MODEL: ${WD14_MODEL:-SmilingWolf/wd-eva02-large-tagger-v3}
      ORT_DEVICE: ${ORT_DEVICE:-auto}
      TAG_CONCURRENCY: ${TAG_CONCURRENCY:-2}
      VLM_BACKEND: ${VLM_BACKEND:-openai}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://ollama:11434/v1}
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
      VLM_API_KEY: ${VLM_API_KEY:-ollama}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-180}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      HF_TOKEN: ${HF_TOKEN:-}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-0}
      CIVITAI_API_KEY: ${CIVITAI_API_KEY:-}
      # A1111 / Forge：訓練好的 LoRA 一鍵匯入（需要 Forge Neo Chino 的 LoRA 匯入 API），例如 http://host.docker.internal:7860
      A1111_URL: ${A1111_URL:-}
      A1111_LORA_SUBFOLDER: ${A1111_LORA_SUBFOLDER:-LoRA-Tag-Studio}
      A1111_API_AUTH: ${A1111_API_AUTH:-}
      # Claude / Codex CLI（VLM 引擎選 Claude 或 Codex 時）：可選的模型、推理強度
      CLAUDE_MODELS: ${CLAUDE_MODELS:-sonnet,opus,haiku,fable}
      CODEX_MODELS: ${CODEX_MODELS:-}
      CLI_EFFORT: ${CLI_EFFORT:-low}
      # 本機訓練（AI Toolkit）：沒開 aitoolkit profile 時訓練頁會顯示服務沒啟動
      AITOOLKIT_URL: ${AITOOLKIT_URL:-http://aitoolkit:8675}
      AI_TOOLKIT_AUTH: ${AI_TOOLKIT_AUTH:-}
      AITOOLKIT_GPU: ${AITOOLKIT_GPU:-0}
    volumes:
      - ./data:/data              # 專案、圖片、標註資料庫、匯出 zip
      - ./import:/import:ro       # 伺服器資料夾匯入（把圖片資料夾放這裡）
      - models:/models            # WD14 模型快取
      # Claude / Codex CLI：把主機「已登入」的 ~/.claude、~/.codex 掛進來（讀寫，更新登入權杖用）。
      # 在 .env 設 CLAUDE_CREDS_DIR=/home/<你>/.claude、CODEX_CREDS_DIR=/home/<你>/.codex（用 sudo 執行時請用絕對路徑）；
      # 沒設定就掛空資料夾，這兩個引擎會顯示為不能用
      - ${CLAUDE_CREDS_DIR:-./docker/cli-empty/claude}:/cli-home/.claude
      - ${CODEX_CREDS_DIR:-./docker/cli-empty/codex}:/cli-home/.codex
      # 本機訓練的底模（Forge 的 Stable-diffusion 資料夾）。兩個容器要掛在相同路徑
      - ${AITOOLKIT_BASE_MODELS_DIR:-./data/aitoolkit/base-models}:/base-models:ro

  # ---------------------------------------------------------------- 本機訓練（AI Toolkit）
  # LoRA 訓練的引擎。畫面在 LoRA Tag Studio 的「訓練」頁，由 app 透過內部網路呼叫，所以不開對外的 port。
  # 版本固定：工作設定的格式隨版本變動，升級時要測過再改這裡。GPU 用 CDI（原因見 docker-compose.gpu.yml）
  aitoolkit:
    image: ostris/aitoolkit:0.13.41
    profiles: ["aitoolkit"]
    restart: unless-stopped
    shm_size: "8gb"
    command: ["/bin/bash", "/aitoolkit-start.sh"]
    environment:
      AI_TOOLKIT_AUTH: ${AI_TOOLKIT_AUTH:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NODE_ENV: production
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./docker/aitoolkit-start.sh:/aitoolkit-start.sh:ro
      - ./data/aitoolkit/datasets:/app/ai-toolkit/datasets    # 送訓練的資料集快照
      - ./data/aitoolkit/output:/app/ai-toolkit/output        # LoRA、範例圖
      - ./data/aitoolkit/state:/app/ai-toolkit/state          # 工作資料庫
      - ./data/aitoolkit/hf-cache:/root/.cache/huggingface    # 下載的底模（SDXL、Anima）
      - ${AITOOLKIT_BASE_MODELS_DIR:-./data/aitoolkit/base-models}:/base-models:ro

  # ---------------------------------------------------------------- 本機 VLM（一般用途）
  ollama:
    image: ollama/ollama:latest
    profiles: ["vlm"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama:/root/.ollama

  # 首次啟動時自動下載 VLM_MODEL（完成後自動結束）
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["vlm"]
    depends_on: [ollama]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${VLM_MODEL:-qwen2.5vl:7b}"]

  # ---------------------------------------------------------------- JoyCaption（無審查，適合 NSFW 資料集）
  # 使用時請在 .env 設定：
  #   VLM_BASE_URL=http://joycaption:8000/v1  VLM_MODEL=joycaption  VLM_API_KEY=EMPTY
  joycaption:
    build:
      context: ./docker
      dockerfile: joycaption.Dockerfile
      args:
        VLLM_IMAGE: ${JOYCAPTION_VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
        TRANSFORMERS_VERSION: ${JOYCAPTION_TRANSFORMERS:-5.16.1}
    profiles: ["joycaption"]
    restart: unless-stopped
    ipc: host
    entrypoint: ["vllm", "serve"]
    command:
      - fancyfeast/llama-joycaption-beta-one-hf-llava
      - --served-model-name=joycaption
      - --max-model-len=4096
      - --gpu-memory-utilization=${JOYCAPTION_GPU_UTIL:-0.7}
      - --enable-prefix-caching
      # 休眠模式：WebUI 右上角「VRAM」可讓 JoyCaption 休眠（釋放 VRAM；模型移到系統記憶體，或選擇連系統記憶體一起釋放），
      # 標註時自動喚醒
      - --enable-sleep-mode
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # 開啟 /sleep、/wake_up、/is_sleeping 端點。這些開發用端點不該對外：這個服務沒有開放埠，只有 app 連得到
      VLLM_SERVER_DEV_MODE: "1"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  ollama:
  hf-cache:
